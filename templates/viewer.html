<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360° Produktansicht - Drehteller Steuerung</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/viewer.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h2 class="mb-0">360° Produktansicht</h2>
                <div>
                    <a href="/projects" class="btn btn-light btn-sm me-2">
                        <i class="bi bi-arrow-left"></i> Zurück zu Projekten
                    </a>
                    <button id="fullscreen-btn" class="btn btn-light btn-sm">
                        <i class="bi bi-fullscreen"></i>
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div class="viewer-container">
                    <div id="spinner" class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Laden...</span>
                    </div>
                    <div id="product-viewer"></div>
                </div>

                <div class="viewer-controls">
                    <div class="control-btn-group">
                        <button id="play-btn" class="btn btn-primary">
                            <i class="bi bi-play-fill"></i> Auto-Rotation
                        </button>
                        <button id="reset-btn" class="btn btn-secondary">
                            <i class="bi bi-arrow-counterclockwise"></i> Zurücksetzen
                        </button>
                    </div>

                    <div class="control-btn-group">
                        <button id="zoom-in-btn" class="btn btn-secondary">
                            <i class="bi bi-zoom-in"></i>
                        </button>
                        <button id="zoom-out-btn" class="btn btn-secondary">
                            <i class="bi bi-zoom-out"></i>
                        </button>
                    </div>
                </div>

                <div class="project-info mt-4">
                    <div class="row">
                        <div class="col-md-6">
                            <h4 id="project-name">Projekt: <span>Wird geladen...</span></h4>
                        </div>
                        <div class="col-md-6 text-md-end">
                            <p id="image-count">Bilder: <span>...</span></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-footer text-center">
                <p>Ziehen Sie mit der Maus oder wischen Sie auf dem Touchscreen, um das Objekt zu drehen.</p>
                <small class="text-muted">Erstellt mit 360° Drehteller Steuerung</small>
            </div>
        </div>
    </div>

    <script src="/static/js/interactive-viewer.js"></script>
</body>
</html>
