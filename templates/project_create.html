{% extends "base.html" %}

{% block title %}Neues Projekt erstellen - 360° Drehteller Steuerung{% endblock %}

{% block content %}
<div class="card project-form-container">
    <h2>Neues Projekt erstellen</h2>
    
    {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
    {% endif %}
    
    <form id="projectForm" action="{{ url_for('projects.create_project') }}" method="POST">
        <div class="form-group">
            <label for="name">Projektname:</label>
            <input type="text" id="name" name="name" required value="{{ request.form.get('name', '') }}">
        </div>
        
        <div class="form-group">
            <label for="description">Beschreibung:</label>
            <textarea id="description" name="description" rows="4">{{ request.form.get('description', '') }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="angle_step">Winkelschritt (Grad):</label>
            <input type="number" id="angle_step" name="angle_step" min="1" max="90" value="{{ request.form.get('angle_step', 15) }}">
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Projekt erstellen</button>
            <a href="{{ url_for('projects.projects_page') }}" class="btn btn-secondary">Abbrechen</a>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/project_create.js') }}"></script>
{% endblock %}
