<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neues Projekt erstellen - 360° Drehteller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f7;
        }
        .create-project-container {
            max-width: 600px;
            margin: 2rem auto;
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-custom-primary {
            background-color: #3498db;
            color: white;
        }
        .btn-custom-primary:hover {
            background-color: #2980b9;
        }
        .btn-custom-secondary {
            background-color: #ecf0f1;
            color: #2c3e50;
        }
        .btn-custom-secondary:hover {
            background-color: #dfe4e6;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="/">360° Drehteller</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Startseite</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/projects">Projekte</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="create-project-container">
            <h1 class="mb-4 text-center">Neues Projekt erstellen</h1>
            
            <form action="{{ url_for('projects.create_project') }}" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label">Projektname</label>
                    <input type="text" class="form-control" id="name" name="name" required 
                           placeholder="z.B. Product 360° Aufnahme">
                </div>
                
                <div class="mb-3">
                    <label for="description" class="form-label">Beschreibung <small class="text-muted">(optional)</small></label>
                    <textarea class="form-control" id="description" name="description" rows="3"
                              placeholder="Beschreiben Sie kurz das Ziel des Projekts"></textarea>
                </div>
                
                <div class="mb-3">
                    <label for="angle_step" class="form-label">Winkelschritt</label>
                    <select class="form-select" id="angle_step" name="angle_step">
                        <option value="5">5° (72 Bilder pro Umdrehung) - Höchste Auflösung</option>
                        <option value="10" selected>10° (36 Bilder pro Umdrehung) - Empfohlen</option>
                        <option value="15">15° (24 Bilder pro Umdrehung) - Standard</option>
                        <option value="30">30° (12 Bilder pro Umdrehung) - Schnelle Aufnahme</option>
                    </select>
                </div>
                
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('projects.projects_page') }}" class="btn btn-custom-secondary">
                        Abbrechen
                    </a>
                    <button type="submit" class="btn btn-custom-primary">
                        Projekt erstellen
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
