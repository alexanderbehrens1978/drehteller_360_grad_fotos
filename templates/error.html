<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fehler aufgetreten</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="/">360° Drehteller</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Startseite</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/projects">Projekte</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="error-container">
            <div class="error-icon">⚠️</div>
            <h1>Fehler aufgetreten</h1>
            <p class="lead text-muted mb-4">
                {{ message or 'Ein unerwarteter Fehler ist aufgetreten. Bitte versuchen Sie es später erneut.' }}
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="/" class="btn btn-home">
                    Zur Startseite
                </a>
                <a href="/projects" class="btn btn-secondary">
                    Zu den Projekten
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
