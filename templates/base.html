<!-- Datei: templates/base.html - Basis-Template für alle Seiten -->
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}360° Drehteller Fotografie-System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='/static/css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <nav class="main-nav">
            <div class="logo">
                <h1>360° Drehteller</h1>
            </div>
            <ul class="nav-links">
                <li><a href="{{ url_for('index') }}">Projekte</a></li>
                <li><a href="{{ url_for('app_settings') }}">Einstellungen</a></li>
                <li><a href="{{ url_for('viewer') }}">360° Viewer</a></li>
            </ul>
        </nav>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>

        <footer class="main-footer">
            <p>&copy; 2025 Alexander Behrens 360° Drehteller Steuerung</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
