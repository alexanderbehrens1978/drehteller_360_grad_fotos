<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project.name }} - 360° Drehteller Steuerung</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/cloudimage-viewer.css">
</head>
<body>
    <header>
        <h1>360° Drehteller Steuerung</h1>
        <nav>
            <a href="/">Startseite</a>
            <a href="/projects">Projekte</a>
            <a href="/settings">Einstellungen</a>
            <a href="/viewer" class="active">360° Viewer</a>
        </nav>
    </header>
    
    <main>
        <div class="card">
            <h2>{{ project.name }}</h2>
            <p>360° Ansicht Ihres Produkts</p>
            
            <div class="viewer-container">
                <div class="image-container" id="product-viewer">
                    {% for image in project.images %}
                        <img 
                            src="/projects/image/{{ project.id }}/{{ image.path }}" 
                            class="product-image {% if loop.first %}active{% endif %}" 
                            alt="Ansicht {{ loop.index }}"
                            data-angle="{{ image.angle if image.angle is defined else loop.index0 * 360 // project.images|length }}"
                        >
                    {% endfor %}
                    <div class="bottom-circle">
                        <div class="circle-indicator" id="circle-indicator"></div>
                    </div>
                </div>
            </div>
            
            <div class="controls">
                <button id="pause-btn" class="control-btn">⏸ Pause</button>
                <button id="reset-btn" class="control-btn">↺ Zurücksetzen</button>
                <button id="zoom-in-btn" class="control-btn">🔍+ Vergrößern</button>
                <button id="zoom-out-btn" class="control-btn">🔍- Verkleinern</button>
                <a href="/projects/{{ project.id }}" class="btn">Zurück zum Projekt</a>
                <a href="/viewer" class="btn">Zurück zur Übersicht</a>
            </div>
            
            <div class="viewer-settings">
                <h3>Viewer-Einstellungen</h3>
                <div class="settings-group">
                    <div class="settings-item">
                        <label for="auto-play-behavior">Auto Play Verhalten:</label>
                        <select id="auto-play-behavior">
                            <option value="spin-x" selected>Horizontal (spin-x)</option>
                            <option value="spin-xy">Horizontal und Vertikal (spin-xy)</option>
                        </select>
                    </div>
                    
                    <div class="settings-item">
                        <label for="auto-play-speed">Auto Play Geschwindigkeit (ms):</label>
                        <input type="number" id="auto-play-speed" value="100" min="50" max="500">
                    </div>
                    
                    <div class="settings-item">
                        <label for="drag-speed">Drag Geschwindigkeit:</label>
                        <input type="number" id="drag-speed" value="120" min="50" max="300">
                    </div>
                </div>
                
                <div class="settings-group">
                    <div class="settings-item">
                        <input type="checkbox" id="auto-play" checked>
                        <label for="auto-play">Auto Play</label>
                    </div>
                    
                    <div class="settings-item">
                        <input type="checkbox" id="auto-play-once">
                        <label for="auto-play-once">Einmal abspielen</label>
                    </div>
                    
                    <div class="settings-item">
                        <input type="checkbox" id="auto-play-reverse">
                        <label for="auto-play-reverse">Rückwärts abspielen</label>
                    </div>
                    
                    <div class="settings-item">
                        <input type="checkbox" id="draggable" checked>
                        <label for="draggable">Drag-Funktion</label>
                    </div>
                    
                    <div class="settings-item">
                        <input type="checkbox" id="fullscreen">
                        <label for="fullscreen">Vollbild</label>
                    </div>
                    
                    <div class="settings-item">
                        <input type="checkbox" id="magnifier">
                        <label for="magnifier">Lupe</label>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2025 Alexander Behrens 360° Drehteller Steuerung</p>
    </footer>
    
    <script src="/static/js/cloudimage-viewer.js"></script>
</body>
</html>
